name: 💡 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算完成？
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: ischolar 本地工作台
        - label: website 课程门户
        - label: 讲义 / 模板
        - label: 文档 / 工程
