name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ischolar-backend:
    name: ischolar backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ischolar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Bytecode compile check
        run: python -m py_compile app/backend.py app/frontend.py app/prompts.py launcher.py
      - name: Run pytest
        run: python -m pytest tests -q

  website-portal:
    name: website check / build / e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: npm ci
        run: npm ci
      - name: check (lint + typecheck + content)
        run: npm run check
      - name: build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run workbench e2e (desktop + mobile)
        run: npx playwright test tests/workbench.spec.ts --project=desktop --project=mobile
