[project]
name = "ischolar"
version = "6.2.0"
description = "iScholar 本地科研智能体工作台（Streamlit 前端 + FastAPI 后端，支持用户自填 DeepSeek 等大模型秘钥，双击运行）"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
ischolar = "launcher:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
